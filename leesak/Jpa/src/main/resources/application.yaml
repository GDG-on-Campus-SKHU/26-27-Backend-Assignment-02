spring:
  application:
    name: books-genres-api
  datasource:
    url: "${H2_DB_URL:jdbc:h2:file:./data/books;DB_CLOSE_ON_EXIT=FALSE}"
    username: "${H2_DB_USER_NAME:sa}"
    password: "${H2_DB_PASSWORD:}"
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.web.servlet.DispatcherServlet: DEBUG

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL}
    username: ${DB_USER_NAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
